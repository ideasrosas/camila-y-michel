<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f2e9"><title>Camila y Michel · 1 de octubre de 2027</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400;500&family=Italianno&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f2e9;--ink:#ede8dd;--olive:#7d8264}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--paper);font-family:Georgia,'Times New Roman',serif;overflow:hidden}button,a{-webkit-tap-highlight-color:transparent}.screen{position:fixed;inset:0;overflow:hidden}.envelope-scene{z-index:5;display:grid;place-items:center;background:radial-gradient(ellipse at 48% 42%,#fffefa 0%,#e9e1d6 88%);transition:opacity .85s ease,visibility .85s}.envelope-scene::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(107deg,transparent 0 3px,#4f44330b 4px 5px);opacity:.17}.envelope-scene.exiting{opacity:0;visibility:hidden}.overline{position:absolute;top:11%;left:0;width:100%;text-align:center;color:#7f7868;letter-spacing:.29em;font-size:clamp(10px,2.4vw,12px);text-transform:uppercase}.envelope{position:relative;z-index:2;border:0;padding:0;background:transparent;width:min(82vw,390px);aspect-ratio:0.76;cursor:pointer;filter:drop-shadow(0 18px 19px #32291928);transform:rotate(-5deg);transition:transform .7s ease}.envelope:hover{transform:rotate(-3deg) translateY(-5px)}.paper-back{position:absolute;inset:0;background:#e8dfd1;border:1px solid #d7cabc}.paper-sheet{position:absolute;inset:6% 7%;background:#fffefa;border:1px solid #e3ded5;box-shadow:0 0 6px #342b2120;display:grid;place-items:center;color:#817c72;font-style:italic;font-size:clamp(18px,5vw,27px);transition:transform .9s ease .25s}.flap-left,.flap-right,.flap-bottom,.flap-top{position:absolute;inset:0}.flap-left{background:linear-gradient(115deg,#f7f3ed,#dfd5c9);clip-path:polygon(0 0,52% 53%,0 100%)}.flap-right{background:linear-gradient(240deg,#f5f0e9,#e5dacc);clip-path:polygon(100% 0,48% 53%,100% 100%)}.flap-bottom{background:linear-gradient(10deg,#f7f2eb,#e7ddd0);clip-path:polygon(0 100%,50% 42%,100% 100%)}.flap-top{z-index:2;background:linear-gradient(170deg,#f8f5ee,#e3d9cd);clip-path:polygon(0 0,100% 0,50% 59%);transform-origin:50% 0;backface-visibility:hidden;transition:transform .8s ease}.seal{position:absolute;z-index:3;left:50%;top:56%;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50% 49% 53% 46%;display:grid;place-items:center;color:#eee5da;background:radial-gradient(circle at 31% 24%,#a4a085,#777661 52%,#5f5e4d 80%);box-shadow:inset 0 0 0 4px #e5dfc875,inset 0 0 0 7px #534f4255,0 3px 8px #372c2055;font-size:24px;font-style:italic;letter-spacing:-.12em;transition:opacity .35s ease}.envelope-scene.open .flap-top{transform:rotateX(178deg);z-index:0}.envelope-scene.open .paper-sheet{transform:translateY(-30%)}.envelope-scene.open .seal{opacity:0}.tap{position:absolute;bottom:10%;width:100%;text-align:center;font-size:12px;letter-spacing:.15em;color:#817d71}.paper-wipe{z-index:4;background:#fffefa;transform:translateX(-102%);pointer-events:none}.paper-wipe.wipe{animation:paperPass 1.25s cubic-bezier(.6,0,.3,1) forwards}@keyframes paperPass{0%{transform:translateX(-102%)}45%{transform:translateX(0)}100%{transform:translateX(102%)}}.story{z-index:1;background:#fbf9f5;display:flex;align-items:center;justify-content:center}.story canvas{display:block;position:absolute;width:100%;height:100%;object-fit:cover}.paper-grain{z-index:1;pointer-events:none;opacity:.18;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.64' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='120' height='120' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E")}.shade{z-index:2;pointer-events:none;opacity:0;background:linear-gradient(to bottom,#111a1c91 0%,#1120224a 33%,#101b1cb9 100%);transition:opacity 1.9s ease}.shade.on{opacity:1}.sparkle{z-index:3;pointer-events:none;opacity:0;background:radial-gradient(ellipse 85px 160px at 50% 45%,#fff 0%,#fffdf6e8 13%,#fff1cb75 31%,transparent 75%);filter:blur(8px);transform:translate(-125%,-120%) rotate(-26deg)}.sparkle.play{opacity:1;animation:glowPass 2.15s ease-in-out forwards}@keyframes glowPass{0%{transform:translate(-100%,-90%) rotate(-30deg);opacity:0}28%{opacity:1}74%{opacity:.95}100%{transform:translate(90%,65%) rotate(-30deg);opacity:0}}.stardust{z-index:3;pointer-events:none;overflow:hidden}.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;box-shadow:0 0 9px 3px #fffac0b3;animation:twinkle 1.3s ease-in-out infinite alternate}@keyframes twinkle{from{opacity:.15;transform:scale(.4)}to{opacity:.95;transform:scale(1.6)}}.content{z-index:4;display:flex;justify-content:center;align-items:center;flex-direction:column;text-align:center;color:var(--ink);padding:20px 20px 70px;opacity:0;transform:translateY(16px);transition:opacity 1.4s ease,transform 1.4s ease;text-shadow:0 2px 15px #050807a0}.content.show{opacity:1;transform:none}.kicker{font-size:clamp(11px,2.8vw,15px);letter-spacing:.32em;text-transform:uppercase;margin:0 0 24px}.names{font-family:'Snell Roundhand','Brush Script MT','Apple Chancery','URW Chancery L',cursive;font-weight:400;font-style:italic;font-size:clamp(48px,12vw,105px);line-height:1.05;margin:0;color:#fff;letter-spacing:-.055em}.date{font-size:clamp(12px,3.3vw,16px);letter-spacing:.21em;text-transform:uppercase;margin:24px 0 40px}.cta{display:inline-block;border:1px solid #fff9;border-radius:28px;background:#fff;color:#343c37;text-shadow:none;padding:15px 27px;text-decoration:none;font:12px Georgia,serif;letter-spacing:.17em;text-transform:uppercase;box-shadow:0 7px 22px #0004}.status{min-height:1.7em;font-size:12px;letter-spacing:.04em}.music{z-index:6;position:fixed;right:16px;bottom:18px;width:45px;height:45px;border:1px solid #ffffffaa;border-radius:50%;background:#343e36ab;color:#fff;font-size:19px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .7s}.music.visible{opacity:1;pointer-events:auto}.loading{z-index:7;display:none;place-items:center;background:#f7f4ed;color:#766e60;font-size:13px;letter-spacing:.16em}.loading.show{display:grid}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.overline,.tap,.kicker,.date,.cta{font-family:'Cormorant SC',Georgia,serif}.names{font-family:'Cormorant SC',Georgia,serif;font-style:normal;letter-spacing:.035em;font-size:clamp(42px,9.5vw,88px)}.handwriting{font-family:'Italianno','Snell Roundhand',cursive;font-size:clamp(42px,10vw,75px);line-height:1;margin:-11px 0 4px;color:#fff}.paper-sheet{font-family:'Cormorant SC',Georgia,serif;font-style:normal}.seal{font-family:'Cormorant SC',Georgia,serif;font-style:normal;letter-spacing:0;font-size:23px;padding-right:0;text-indent:0}</style>
</head>
<body>
<div class="screen story" id="story" aria-label="Invitación de Camila y Michel"><canvas id="painting" aria-label="Acuarela de la entrada a la finca"></canvas></div>
<div class="screen paper-grain" aria-hidden="true"></div><div class="screen shade" id="shade"></div><div class="screen sparkle" id="sparkle"></div><div class="screen stardust" id="stardust"></div>
<div class="screen content" id="content"><p class="kicker">Tenemos algo que contaros</p><p class="handwriting">Nos casamos</p><h1 class="names">Camila &amp; Michel</h1><p class="date">1 de octubre de 2027 · Málaga</p><a class="cta" id="canva" href="#">Ver nuestra invitación</a><p class="status" id="status" role="status"></p></div>
<div class="screen paper-wipe" id="wipe"></div>
<div class="screen envelope-scene" id="intro"><p class="overline">Una invitación para ti</p><button class="envelope" id="open" type="button" aria-label="Abrir la invitación de Camila y Michel"><span class="paper-back"></span><span class="paper-sheet">Camila &amp; Michel</span><span class="flap-left"></span><span class="flap-right"></span><span class="flap-bottom"></span><span class="flap-top"></span><span class="seal">C·M</span></button><p class="tap">Toca el lacre para abrir</p></div>
<button class="music" id="music" type="button" aria-label="Pausar música">♫</button><div class="screen loading" id="loading">Preparando la invitación…</div>
<script>
// Cuando publiques la web en Canva, pega aquí su URL entre comillas.
const CANVA_URL = '';
// Opcional: sube al mismo repositorio un archivo llamado musica.mp3 para usar tu propia canción.
const MUSIC_FILE = 'musica.mp3';
const $ = s=>document.querySelector(s), canvas=$('#painting'),cx=canvas.getContext('2d',{willReadFrequently:true});
const intro=$('#intro'),shade=$('#shade'),content=$('#content'),sparkle=$('#sparkle');
const img=new Image();img.src='acuarela.jpg';let artReady=false,opened=false,W,H,base,line,noise,mode='blank',progress=0;
function setupArt(){W=Math.min(680,Math.max(390,Math.round(innerWidth*devicePixelRatio*.85)));H=Math.max(650,Math.round(W*innerHeight/innerWidth));canvas.width=W;canvas.height=H;
const temp=document.createElement('canvas');temp.width=W;temp.height=H;let tc=temp.getContext('2d',{willReadFrequently:true});tc.fillStyle='#fffefa';tc.fillRect(0,0,W,H);
// Se conserva la acuarela original sin recortar el arco ni el camino.
let ratio=Math.min(W/img.width,H/img.height),iw=img.width*ratio,ih=img.height*ratio;tc.drawImage(img,(W-iw)/2,(H-ih)/2,iw,ih);base=tc.getImageData(0,0,W,H);line=tc.createImageData(W,H);noise=new Float32Array(W*H);
const lum=new Uint8Array(W*H);for(let i=0;i<lum.length;i++){let k=i*4;lum[i]=(.2126*base.data[k]+.7152*base.data[k+1]+.0722*base.data[k+2])|0}
for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){let i=y*W+x,a=lum[i-W-1],b=lum[i-W],c=lum[i-W+1],d=lum[i-1],f=lum[i+1],g=lum[i+W-1],h=lum[i+W],j=lum[i+W+1];let edge=Math.min(1,Math.hypot(-a+c-2*d+2*f-g+j,-a-2*b-c+g+2*h+j)/205);let k=i*4;let val=Math.round(252-edge*155);line.data[k]=val;line.data[k+1]=val-2;line.data[k+2]=val-5;line.data[k+3]=255;noise[i]=(Math.sin(x*.031+y*.043)*.08+Math.sin(x*.13-y*.09)*.04+Math.random()*.09)}artReady=true;render('blank',0)}
function render(kind,p){if(!artReady)return;mode=kind;progress=p;let frame=cx.createImageData(W,H),out=frame.data;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=y*W+x,k=i*4;let front=x/W*.45+y/H*.55+noise[i];let pen=kind==='blank'?0:Math.max(0,Math.min(1,(p-front)*9));let wash=kind==='wash'||kind==='done'?Math.max(0,Math.min(1,(p-front)*5)):0;let l=kind==='done'?1:pen;for(let c=0;c<3;c++)out[k+c]=Math.round(254*(1-l)+line.data[k+c]*l*(1-wash)+base.data[k+c]*wash);out[k+3]=255}cx.putImageData(frame,0,0)}
function animate(kind,duration){return new Promise(done=>{const start=performance.now();function tick(now){let p=Math.min(1,(now-start)/duration);render(kind,p);if(p<1)requestAnimationFrame(tick);else done()}requestAnimationFrame(tick)})}
img.onload=setupArt;img.onerror=()=>{$('#loading').classList.add('show');$('#loading').textContent='Falta acuarela.jpg junto al archivo HTML'};addEventListener('resize',()=>{if(img.complete&&img.naturalWidth){setupArt();if(mode!=='blank')render(mode,progress)}});
const musicBtn=$('#music');let audio=new Audio(MUSIC_FILE),ctx=null,timer=null,playing=false,useFile=false;audio.loop=true;audio.volume=.32;audio.preload='none';
function note(freq,when,dur){if(!ctx)return;let osc=ctx.createOscillator(),gain=ctx.createGain(),soft=ctx.createBiquadFilter();osc.type='sine';osc.frequency.setValueAtTime(freq,when);soft.type='lowpass';soft.frequency.value=1800;gain.gain.setValueAtTime(.0001,when);gain.gain.exponentialRampToValueAtTime(.055,when+.04);gain.gain.exponentialRampToValueAtTime(.0001,when+dur);osc.connect(soft).connect(gain).connect(ctx.destination);osc.start(when);osc.stop(when+dur+.02)}
let step=0;function ambient(){if(!ctx)return;let chord=[261.63,329.63,392,523.25,440,329.63,293.66,392];let t=ctx.currentTime+.08;note(chord[step%chord.length],t,2.1);if(step%4===0)note(chord[step%chord.length]/2,t,3.3);step++}
async function playMusic(){if(playing)return;try{audio.load();await audio.play();useFile=true;playing=true}catch(e){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();ambient();timer=setInterval(ambient,580);useFile=false;playing=true}catch(err){}}musicBtn.textContent=playing?'♫':'♪';musicBtn.setAttribute('aria-label',playing?'Pausar música':'Reproducir música')}
function toggleMusic(){if(playing){if(useFile)audio.pause();else {clearInterval(timer);timer=null;ctx.suspend()}playing=false;musicBtn.textContent='♪';musicBtn.setAttribute('aria-label','Reproducir música')}else if(useFile){audio.play().then(()=>{playing=true;musicBtn.textContent='♫'}).catch(()=>playMusic())}else if(ctx){ctx.resume();ambient();timer=setInterval(ambient,580);playing=true;musicBtn.textContent='♫'}else playMusic()}
musicBtn.onclick=toggleMusic;
$('#open').onclick=async()=>{if(opened)return;opened=true;playMusic();intro.classList.add('open');musicBtn.classList.add('visible');await new Promise(r=>setTimeout(r,850));$('#wipe').classList.add('wipe');await new Promise(r=>setTimeout(r,460));intro.classList.add('exiting');if(!artReady){$('#loading').classList.add('show');while(!artReady&&img.complete===false)await new Promise(r=>setTimeout(r,100));$('#loading').classList.remove('show')}await new Promise(r=>setTimeout(r,270));await animate('line',2300);await animate('wash',2500);render('done',1);shade.classList.add('on');await new Promise(r=>setTimeout(r,850));sparkle.classList.add('play');for(let i=0;i<65;i++){let s=document.createElement('i');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*2}s`;$('#stardust').append(s)}await new Promise(r=>setTimeout(r,1150));content.classList.add('show')};
if(CANVA_URL){$('#canva').href=CANVA_URL}else $('#canva').onclick=e=>{e.preventDefault();$('#status').textContent='La web de la boda estará disponible pronto.'};
</script>
</body></html>
