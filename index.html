<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6f1">
  <title>Camila y Michel · Nuestra boda</title>
  <style>
    :root { color-scheme: light; --ink:#403c32; --olive:#777d5b; --paper:#f8f6f1; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Georgia, 'Times New Roman', serif; }
    button,a { -webkit-tap-highlight-color:transparent; }
    .stage { min-height:100svh; display:grid; place-items:center; overflow:hidden; position:relative; padding:18px; }
    .intro { position:absolute; inset:0; display:grid; place-items:center; background:radial-gradient(circle at 50% 35%,#fff 0%,#f5f1e8 75%); z-index:3; transition:opacity 1.15s ease, visibility 1.15s; }
    .intro::before { content:''; position:absolute; inset:22px; border:1px solid #d8d3c5; pointer-events:none; }
    .invitation { text-align:center; display:grid; justify-items:center; gap:24px; padding:30px 16px; }
    .eyebrow { font-size:12px; letter-spacing:.32em; text-transform:uppercase; color:#77735f; margin:0; }
    .envelope { width:min(82vw,390px); height:min(54vw,255px); max-height:255px; position:relative; border:0; padding:0; background:none; cursor:pointer; perspective:800px; filter:drop-shadow(0 14px 16px #4b493b26); }
    .envelope .back { position:absolute; inset:0; background:#e1d7c2; border:1px solid #c3b79e; }
    .letter { position:absolute; left:8%; right:8%; top:13%; height:78%; background:#fffdfa; border:1px solid #e4dacc; box-shadow:0 2px 9px #665c3a20; display:grid; place-items:center; transform:translateY(0); transition:transform 1s ease .38s; font-size:clamp(17px,4vw,24px); font-style:italic; color:#666b4e; }
    .fold-left,.fold-right,.fold-bottom { position:absolute; inset:0; }
    .fold-left { background:#eae1d0; clip-path:polygon(0 0,52% 52%,0 100%); }
    .fold-right { background:#e7ddca; clip-path:polygon(100% 0,48% 52%,100% 100%); }
    .fold-bottom { background:#f1e9d9; clip-path:polygon(0 100%,50% 44%,100% 100%); }
    .flap { position:absolute; inset:0; background:#f3ebda; clip-path:polygon(0 0,100% 0,50% 61%); transform-origin:50% 0; transition:transform .8s ease; z-index:2; backface-visibility:hidden; }
    .seal { position:absolute; z-index:4; left:50%; top:57%; width:62px; height:62px; transform:translate(-50%,-50%); display:grid; place-items:center; border-radius:45% 55% 51% 49%; color:#f3ecd8; font-size:21px; font-style:italic; letter-spacing:-.09em; background:radial-gradient(circle at 36% 30%,#a6aa7c,#666d4c 68%,#505739); box-shadow:inset 0 0 0 4px #ffffff2b,0 3px 8px #3335; transition:opacity .3s ease; }
    .hint { margin:0; font-size:13px; letter-spacing:.09em; color:#77735f; }
    .intro.open .flap { transform:rotateX(175deg); z-index:0; }
    .intro.open .seal { opacity:0; }
    .intro.open .letter { transform:translateY(-43%); }
    .intro.gone { opacity:0; visibility:hidden; }
    .page { width:min(100%,550px); margin:auto; text-align:center; opacity:0; transform:translateY(12px); transition:opacity .8s ease,transform .8s ease; }
    .page.show { opacity:1; transform:none; }
    .art { width:min(100%,calc(70svh * 1240 / 1748)); margin:auto; aspect-ratio:1240 / 1748; background:#fff; position:relative; overflow:hidden; }
    .art img { display:block; width:100%; height:100%; object-fit:contain; clip-path:inset(0 100% 0 0); }
    .page.show .art img { animation:paint 4.5s ease-in-out .3s forwards; }
    @keyframes paint { 0% { clip-path:inset(0 100% 0 0); filter:blur(7px); opacity:.15; } 100% { clip-path:inset(0 0 0 0); filter:blur(0); opacity:1; } }
    .details { padding:4px 10px 32px; opacity:0; transform:translateY(12px); }
    .page.show .details { animation:enter .9s ease 3.4s forwards; }
    @keyframes enter { to { opacity:1; transform:none; } }
    .date { margin:0 0 13px; font-size:clamp(12px,3vw,16px); letter-spacing:.25em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(29px,7vw,42px); line-height:1.15; font-weight:400; letter-spacing:.12em; text-transform:uppercase; }
    .place { margin:14px 0 22px; font-size:clamp(12px,3vw,16px); letter-spacing:.22em; text-transform:uppercase; font-style:italic; }
    .cta { border:1px solid var(--olive); display:inline-block; background:var(--olive); color:#fff; font:inherit; font-size:13px; letter-spacing:.15em; text-transform:uppercase; text-decoration:none; padding:14px 24px; cursor:pointer; }
    .cta:focus-visible,.envelope:focus-visible { outline:3px solid #a6aa7c; outline-offset:5px; }
    .notice { font-size:13px; color:#766e5c; min-height:1.5em; }
    @media (min-height:880px) { .stage { padding:25px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <main class="stage">
    <section class="intro" id="intro" aria-label="Abrir la invitación">
      <div class="invitation">
        <p class="eyebrow">Tenemos algo que contaros</p>
        <button class="envelope" id="open" type="button" aria-label="Abrir el sobre de Camila y Michel">
          <span class="back"></span><span class="letter">Estáis invitados</span>
          <span class="fold-left"></span><span class="fold-right"></span><span class="fold-bottom"></span>
          <span class="flap"></span><span class="seal" aria-hidden="true">C·M</span>
        </button>
        <p class="hint">Toca el lacre para abrir la invitación</p>
      </div>
    </section>
    <section class="page" id="page" aria-label="Invitación de boda">
      <div class="art"><img src="acuarela.jpg" alt="Acuarela de la entrada al lugar de celebración de Camila y Michel"></div>
      <div class="details">
        <p class="date">1 octubre 2027</p>
        <h1>Camila y Michel</h1>
        <p class="place">Málaga, España</p>
        <a class="cta" id="canva" href="#">Ver nuestra invitación</a>
        <p class="notice" id="notice" role="status"></p>
      </div>
    </section>
  </main>
  <script>
    // Sustituir esta dirección por la URL pública de la web de Canva cuando esté lista.
    const CANVA_URL = '';
    const intro = document.querySelector('#intro');
    const page = document.querySelector('#page');
    let opened = false;
    document.querySelector('#open').addEventListener('click', () => {
      if (opened) return;
      opened = true;
      intro.classList.add('open');
      window.setTimeout(() => { intro.classList.add('gone'); page.classList.add('show'); }, 1650);
    });
    const link = document.querySelector('#canva');
    if (CANVA_URL) link.href = CANVA_URL;
    else link.addEventListener('click', event => {
      event.preventDefault();
      document.querySelector('#notice').textContent = 'La web de la boda estará disponible pronto.';
    });
  </script>
</body>
</html>
